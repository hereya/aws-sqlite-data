name: hereya/aws-sqlite-data
version: 0.1.3
description: "Durable multi-tenant SQLite storage: S3-replicated (Litestream) per-app SQLite files served by an HTTP Data API on a self-healing EC2 Spot singleton, fronted by an IAM-authorized API Gateway. Pair with hereya/aws-sqlite-db for per-app provisioning."
visibility: public
iac: cdk
infra: aws
parameters:
  capabilityEnforce:
    description: "When 'true', the Data API REQUIRES a valid x-hereya-capability token on every data route (missing or invalid -> 403 CAPABILITY_DENIED). 'false' (default) = warn mode: the token is validated when present but a request without one is allowed (logging cap_missing). Flip to 'true' once every caller mints or holds tokens (hereya/aws-sqlite-db provisions one per app)."
    mandatory: false
    default: "false"
  amiId:
    description: "AMI of the database VM. Pinned by default to ami-06f589fd2af7a9fc7 (AL2023 kernel-6.1 arm64, eu-west-1), so that an ordinary deploy NEVER replaces the instance (a replacement = ~60s with no Data API). Bump PINNED_AMI_ID in lib/ami-pin.ts, or pass an id here, to move the OS deliberately; npm run check:ami says when a newer AL2023 exists. latest restores auto-resolution of the newest AL2023 arm64 image at every deploy (and with it the surprise replacement); outside eu-west-1, latest or a region-local id is required."
    mandatory: false
    default: "ami-06f589fd2af7a9fc7"
